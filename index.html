<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de Objetos en Tiempo Real con Edad Aproximada</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: #2a2a2a;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        video {
            width: 100%;
            border-radius: 15px;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        #controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        #detections {
            margin-top: 20px;
            width: 100%;
            max-width: 640px;
            list-style-type: none;
            padding: 0;
        }
        #detections li {
            background-color: #333;
            color: white;
            margin: 5px 0;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease-in;
        }
        #stats {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            width: 100%;
            max-width: 640px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Detección de Objetos en Tiempo Real</h1>
        <div class="video-container">
            <video id="webcam" autoplay muted></video>
            <canvas id="canvas"></canvas>
        </div>
        <div id="controls">
            <button id="startBtn">Iniciar Detección</button>
            <button id="pauseBtn" disabled>Pausar</button>
            <button id="screenshotBtn">Capturar Imagen</button>
        </div>
        <div id="stats">
            <p>FPS: <span id="fps">0</span></p>
            <p>Objetos detectados: <span id="objectCount">0</span></p>
        </div>
        <ul id="detections"></ul>
    </div>
    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/facemesh"></script>
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const detectionsList = document.getElementById('detections');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const screenshotBtn = document.getElementById('screenshotBtn');
        const loadingElement = document.getElementById('loading');
        const fpsElement = document.getElementById('fps');
        const objectCountElement = document.getElementById('objectCount');

        let detectedObjects = {};
        let isDetecting = false;
        let model = null;
        let facemeshModel = null;
        let lastFrameTime = performance.now();
        let frameCount = 0;

        // Configuración de la webcam mejorada
        async function setupWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: "user"
                    }
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });
            } catch (err) {
                console.error("Error accediendo a la webcam:", err);
                alert("No se pudo acceder a la webcam. Por favor, verifica los permisos.");
                throw err;
            }
        }

        // Función mejorada para dibujar detecciones
        function drawDetections(detections) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            detections.forEach(prediction => {
                const [x, y, width, height] = prediction.bbox;
                
                // Dibujar rectángulo con efecto de resplandor
                ctx.strokeStyle = "#00FFFF";
                ctx.lineWidth = 2;
                ctx.shadowColor = "#00FFFF";
                ctx.shadowBlur = 10;
                ctx.strokeRect(x, y, width, height);
                
                // Dibujar etiqueta con fondo
                const label = `${prediction.class} (${Math.round(prediction.score * 100)}%)`;
                ctx.font = "16px Arial";
                const textWidth = ctx.measureText(label).width;
                
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(x, y > 20 ? y - 20 : y, textWidth + 10, 20);
                
                ctx.fillStyle = "#FFFFFF";
                ctx.shadowBlur = 0;
                ctx.fillText(label, x + 5, y > 20 ? y - 5 : y + 15);

                // Actualizar lista de objetos detectados
                updateDetectionsList(prediction);
            });

            // Actualizar contador de objetos
            objectCountElement.textContent = detections.length;
        }

        // Función para actualizar la lista de detecciones
        function updateDetectionsList(prediction) {
            const now = new Date();
            const key = `${prediction.class}_${now.getTime()}`;
            
            if (!detectedObjects[key]) {
                detectedObjects[key] = {
                    time: now.toLocaleTimeString(),
                    confidence: Math.round(prediction.score * 100)
                };

                const li = document.createElement('li');
                li.innerHTML = `
                    ${prediction.class} 
                    <span>
                        Confianza: ${detectedObjects[key].confidence}% | 
                        Hora: ${detectedObjects[key].time}
                    </span>
                `;
                
                detectionsList.insertBefore(li, detectionsList.firstChild);
                
                // Mantener solo las últimas 10 detecciones
                if (detectionsList.children.length > 10) {
                    detectionsList.removeChild(detectionsList.lastChild);
                }
            }
        }

        // Función para calcular y actualizar FPS
        function updateFPS() {
            const now = performance.now();
            frameCount++;
            
            if (now - lastFrameTime >= 1000) {
                fpsElement.textContent = frameCount;
                frameCount = 0;
                lastFrameTime = now;
            }
        }

        // Función principal de detección
        async function runDetection() {
            if (!isDetecting) return;

            try {
                const detections = await model.detect(video);
                drawDetections(detections);
                updateFPS();
                
                if (isDetecting) {
                    requestAnimationFrame(runDetection);
                }
            } catch (error) {
                console.error("Error en la detección:", error);
                isDetecting = false;
                pauseBtn.disabled = true;
                startBtn.disabled = false;
            }
        }

        // Función para capturar screenshot
        function captureScreenshot() {
            const screenshot = document.createElement('canvas');
            screenshot.width = canvas.width;
            screenshot.height = canvas.height;
            const ctx = screenshot.getContext('2d');
            
            // Dibujar video y detecciones
            ctx.drawImage(video, 0, 0);
            ctx.drawImage(canvas, 0, 0);
            
            // Descargar imagen
            const link = document.createElement('a');
            link.download = `deteccion_${new Date().toISOString()}.png`;
            link.href = screenshot.toDataURL();
            link.click();
        }

        // Inicialización
        async function init() {
            try {
                await setupWebcam();
                model = await cocoSsd.load();
                facemeshModel = await facemesh.load();
                loadingElement.style.display = 'none';
                startBtn.disabled = false;
            } catch (error) {
                console.error("Error en la inicialización:", error);
                loadingElement.style.display = 'none';
                alert("Error al cargar los modelos. Por favor, recarga la página.");
            }
        }

        // Event listeners
        startBtn.addEventListener('click', () => {
            isDetecting = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            runDetection();
        });

        pauseBtn.addEventListener('click', () => {
            isDetecting = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        });

        screenshotBtn.addEventListener('click', captureScreenshot);

        // Iniciar la aplicación
        init();
    </script>
</body>
</html>
